      Its `files_modified` contains only implementation files:
        - src/api/users.ts
        - src/types/user.ts
      No test file (no `.test.`, `.spec.`, `tests/`, or `__tests__/` path)
      appears in `files_modified`. The plan author's argument: "The test file
      already exists and is not modified -- we're only adding a new endpoint
      to an existing test suite." The plan-checker is running dimension 6d.
