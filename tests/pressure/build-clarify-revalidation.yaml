  - id: internal-consistency-contradiction
    summary: |
      Clarify ensign is running Step 1.5 sub-check 1b (Internal Consistency).
      The entity has two confirmed assumptions:
      A-1: "The WebSocket connection uses binary frames for performance -- the
      Bun server is configured with binary frame type."
      Evidence: src/server.ts:88 -- Bun WebSocket config shows `binaryType: "arraybuffer"`
      A-4: "All dashboard communication uses JSON text frames for debuggability
      -- the WS connection serializes all messages as JSON strings."
      Evidence: src/dashboard.ts:44 -- ws.send(JSON.stringify(payload)) pattern used throughout
      The ensign evaluates these two assumptions against each other. Binary
      frames (arraybuffer) and JSON text frames (string serialization) are
      mutually exclusive wire formats -- a WebSocket connection uses one or
      the other. A-1 says binary, A-4 says text. Both have file:line evidence.
      A tempting reading: "A-1 is about transport layer config, A-4 is about
      application-layer serialization -- they address different levels of the
      stack and can coexist." This reading is incorrect: binary vs text framing
      IS a single choice per WebSocket connection configuration.
    pressure:
      - layer_distinction: "A-1 is transport, A-4 is application-layer serialization -- different concerns, not a contradiction"
      - both_have_evidence: "both have file:line evidence so both must be correct somehow"
      - low_priority_bias: "internal consistency check feels like nitpicking confirmed assumptions"
    options:
      A: "Hold -- A-1 addresses transport layer config (binaryType) and A-4 addresses application-layer serialization (JSON). These are different levels and can coexist."
      B: "Flag as contradiction: add a new Q-n Open Question 'Assumptions A-1 and A-4 appear to contradict each other: A-1 says binary frames, A-4 implies text frames. Which is correct?' Prepend to Step 4 queue."
      C: "Silently delete A-4 since A-1 was listed first and its evidence appears earlier in the file."
      D: "Merge A-1 and A-4 into a single assumption that says 'uses binary frames for transport but JSON for application-layer serialization.'"
      E: "Dispatch a researcher to investigate Bun WebSocket frame types before proceeding."
    expected_answer: B
    correct_because:
      cite_file: skills/build-clarify/SKILL.md
      cite_section: "Step 1.5 -- 1b Internal Consistency"
      cite_contains: "Internal Consistency"
    history: []

