        - id: task-1
          model: sonnet
          wave: 1
          read_first: [src/auth.ts]
          action: "Implement token signing with HMAC HS256"
          acceptance_criteria: "bun test tests/auth.test.ts"
          files_modified: [src/auth.ts]

