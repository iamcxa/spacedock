          model: haiku
          wave: 2
          read_first: [src/legacy-auth.ts, src/auth.ts]
          action: "Migrate legacy auth to new signing module"
          acceptance_criteria: "bun test tests/legacy-auth.test.ts"
          files_modified: [src/auth-migrator.ts]
