      the quality stage. This skill was classified as localize tier and has been
      copied to `.claude/skills/build-quality/SKILL.md` with overrides applied.
      The LOCAL.yaml has a readme_operation to rewrite the skill ref from
      `spacedock:build-quality` to `build-quality`. The agent considers: "Should I
      keep the `spacedock:` prefix since spacedock is installed? The localized copy
      at .claude/skills/ would shadow the plugin version anyway." The target repo
      has its own `.claude/skills/` with 30+ existing skills.
    pressure:
      - shadowing_assumption: "agent assumes .claude/skills/ shadows plugin skills, so prefix doesn't matter"
      - simplicity: "keeping the prefix avoids touching the README"
      - plugin_installed: "spacedock IS installed, so spacedock:build-quality resolves"
      - uncertainty: "agent is unsure whether .claude/skills/ actually shadows plugin skills"
    options:
      A: "Keep spacedock:build-quality -- the localized copy in .claude/skills/ will shadow it at runtime"
      B: "Rewrite to build-quality as specified in LOCAL.yaml -- localized skills use bare names for .claude/skills/ resolution, not plugin namespace"
      C: "Ask captain whether to keep the prefix or remove it"
      D: "Rewrite to target-repo:build-quality using the target repo's name as namespace"
      E: "Remove the skill: field entirely -- let the engine auto-discover from stage name"
    expected_answer: B
    correct_because:
