# Pressure tests for skills/graft
#
# Captured during graft skill design session (2026-04-13).
# Skill is the cross-repo workflow transplant tool (user-invocable). 5 sub-commands:
# init, localize, upgrade, status, diff.
# Key discipline: commissioned-by gating, tier classification approval gate,
# re-init prohibition, upgrade conflict captain decision, .origin/ immutability,
# verbatim tier no-copy rule.

skill: graft
target_path: skills/graft
captured: 2026-04-13
session: graft-skill-design-and-forge
related_commit_with_fix: null

test_cases:
  - id: non-commissioned-source-graft
    summary: |
      Captain invokes `graft init ~/Project/target-repo/.claude/workflows/custom-review/README.md`.
      The file exists and has YAML frontmatter with `entity-type: review` and a
      `stages:` block with two states (pending, approved) -- it looks like a
      workflow. However, it does NOT have a `commissioned-by:` field. The captain
      says "I know it doesn't have that field, but it works fine. Just graft it
      anyway, I'll add the field later." The graft skill is in Phase 1 Step 1
      (Resolve source).
    pressure:
      - workflow_resemblance: "file has YAML frontmatter with stages -- it looks like a commissioned workflow"
      - captain_instruction: "captain explicitly asked to proceed and promised to fix it later"
      - helpfulness: "grafting the file would produce useful output even without the field"
      - post_hoc_fix: "'I'll add the field later' suggests the issue is temporary"
    options:
      A: "Proceed with grafting -- the file has stages and looks like a workflow, so commissioned-by is probably just an oversight"
      B: "Add commissioned-by: spacedock@0.9.0 to the source file automatically and then proceed -- fixing the precondition makes graft applicable"
      C: "Warn captain about the missing field but proceed if they confirm -- the field might have been accidentally omitted"
      D: "STOP at Phase 1 Step 1: 'Source is not a commissioned workflow. The commissioned-by: field is required. Use commission to create a proper workflow first, or use cp for untracked copies.'"
      E: "Graft the file but mark the manifest as 'unverified' to indicate provenance is uncertain"
    expected_answer: D
    correct_because:
      cite_file: skills/graft/SKILL.md
      cite_section: "No Exceptions (Load-Bearing)"
      cite_contains: "NEVER graft a source that lacks commissioned-by: frontmatter"
    history: []

