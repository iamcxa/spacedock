  # --- Real-world graft session findings (2026-04-13, carlove transplant) ---

  - id: root-script-false-positive-monorepo
    summary: |
      Graft init Phase 3 Step 7 (auto-detect from target repo). The agent finds
      `pnpm-lock.yaml` and reads package.json. The root scripts show
      `"test": "echo 'Error: no test specified' && exit 1"` -- a placeholder
      that exits with code 1. The agent sees the `test` key exists and proposes
      `pnpm test` as the replacement for `bun test`. The target repo is a
      monorepo where the real test commands are per-workspace filters:
      `pnpm --filter '@domain/*' run --if-present test`. CI (reuse-test.yaml)
      confirms the filter-based pattern. The agent did NOT check CI config.
    pressure:
      - key_exists: "package.json has a 'test' key -- it looks like a valid command"
      - convention: "'pnpm test' is the standard way to run tests in pnpm projects"
      - working_assumption: "most projects have a working root test script"
      - extra_work: "scanning CI workflows is extra work beyond the package.json check"
    options:
      A: "Use pnpm test as detected -- the package.json test key exists, so it should work"
      B: "Warn that the test script looks like a stub but still propose pnpm test as default"
      C: "Detect the stub pattern (echo + exit 1), scan CI config (.github/workflows/) and CLAUDE.md for actual test commands, then present the CI-derived commands as defaults"
      D: "Skip test command auto-detection entirely and ask the captain to provide it manually"
      E: "Run pnpm test to verify it works before proposing it"
    expected_answer: C
    correct_because:
      cite_file: skills/graft/SKILL.md
      cite_section: "Phase 3 Step 7"
      cite_contains: "attempt to auto-detect project conventions"
    history:
      - run: 2026-04-13
        actual: A
        note: "Initially proposed pnpm test without verifying. Captain asked to cross-check CI/CLAUDE.md. Found root test script is a stub."

